[project]
name = "rubidiumfreedopplerspectoscropy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniël Nazarkin", email = "me@danicatgames.nl" }
]
requires-python = ">=3.15"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
